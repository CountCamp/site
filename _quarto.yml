lang: nl

project:
  type: website
  output-dir: _site
  # De bronnenlijst (`render`) en de bijlagen (`resources`) staan sinds
  # 24-10-2026 in _quarto-nl.yml, en het menu ook. Waarom: zie het blok
  # "Twee talen" onderaan dit bestand.
  #
  # De bezoekersteller (ontworpen 8-10-2026, spoor teller; hier sinds
  # 14-11-2026, spoor teller2). Na ELKE render, in elk profiel en in beide
  # talen: haalt elke teller uit de uitvoermap en zet in elke bladzij precies
  # één terug -- het blok uit _tools/teller.html -- of, bij het profiel spook,
  # géén, plus de balk en noindex. Dit geldt ook voor de bladzijden die als
  # bijlage binnenkomen (oefenboeken, boek, handleiding, speeltjes, en/); die
  # zag het spookprofiel tot dan toe niet. De teller veranderen = alleen
  # _tools/teller.html veranderen. Nalezen: python3 _tools/tellerwacht.py --echt
  # (of --spook). Staat hier in het basisbestand en niet in een profiel, omdat
  # elke bouw erlangs moet; het script kiest zelf op grond van QUARTO_PROFILE.
  post-render:
    - _tools/teller_zetten.py

website:
  title: "CountCamp"
  description: "Heldere uitleg over statistiek — regressie, correlatie en toetsing — door Benjamin Telkamp. Statistiek leren voelen, onderzoek leren lezen."
  site-url: "https://countcamp.org"
  repo-url: "https://github.com/CountCamp/site"
  favicon: favicon.svg
  open-graph: true
  twitter-card: true

  page-footer:
    left: "© Benjamin Telkamp — CountCamp"
    center: "Alles hier is gratis voor eigen gebruik — [wat mag je ermee?](/gebruik.html)"
    right: "Bouwt met [Quarto](https://quarto.org)."

# Twee bouwprofielen, en `echt` is de gewone gang van zaken (12-8-2026).
#   echt   — de site zoals hij live staat. Staat in _quarto-echt.yml.
#   spook  — een proefdruk: noindex, een balk erboven, geen bezoekersteller.
#            Staat in _quarto-spook.yml en komt alleen langs bij
#            QUARTO_PROFILE=spook.
# De bezoekersteller woont in GEEN van beide profielen meer, maar in
# _tools/teller.html; de post-render-stap bovenaan kiest op grond van het
# profiel of hij erin komt. Daarvóór stond hij in _quarto-echt.yml (12-8 tot
# 14-11-2026), en nog daarvóór hier: een profiel PLAKT zijn include-in-header
# ERBIJ, het vervangt hem niet -- dat is hier gemeten, niet aangenomen. Maar een
# include bereikt alleen de bladzijden die Quarto zelf rendert, en het grootste
# deel van de site komt als bijlage binnen. Die telden in elke proefdruk gewoon
# mee: 201 van 213 bladzijden op 8-10-2026, 224 van 243 op 14-11-2026.
#
# Twee talen (24-10-2026, spoor en_schil). Naast echt/spook is er een tweede
# keuze: welke TAAL er gebouwd wordt.
#   nl     — de Nederlandse site, zoals altijd. Staat in _quarto-nl.yml.
#   en     — de Engelse schil onder en/. Staat in _quarto-en.yml en wordt
#            alleen gebouwd door _tools/publiceer_en.sh, naar _site_en/.
# Uit elke groep hieronder is er MINSTENS één actief; wie niets zegt krijgt de
# eerste van elke groep. Gewoon `quarto render` (en dus de GitHub Action) is
# daarmee echt + nl, precies wat het vóór 24-10 was. QUARTO_PROFILE=spook is
# spook + nl. `--profile en` is echt + en, dus ook de Engelse bladzijden tellen mee.
# Gemeten op Quarto 1.9.38 met een proefproject, alle vier de combinaties.
# "Minstens", niet "precies" (rechtgezet 14-11-2026, spoor teller2): wie er twee
# uit één groep noemt, krijgt ze allebei. Gemeten: QUARTO_PROFILE=spook,echt geeft
# "spook,echt,nl", en bij botsende waarden wint het eerstgenoemde (de titel werd
# die van spook). Zo staat het ook in quarto-cli (src/project/project-profile.ts,
# 1.11.9). De bezoekersteller kiest dan spook: _tools/teller_zetten.py zet in een
# bouw met allebei géén teller.
#
# WAAROM HET MENU, `render` EN `resources` UIT DIT BESTAND VERHUISDEN. Een
# profiel vervangt een enkele waarde (de titel, de voet), maar een LIJST plakt
# het erbij — dezelfde eigenschap als bij de teller hierboven. Gemeten: een
# Engels menu in een profiel gaf "Thuis, Diensten, Home". Alles wat een lijst
# is en per taal verschilt, staat dus in het taalprofiel en niet hier.
# Wat hier staat, lezen allebei de talen.
profile:
  group:
    - [echt, spook]
    - [nl, en]

# Het taalknopje (NL · EN) en de hreflang-verwijzingen. Het filter leest
# _tools/taalparen.tsv en doet op een bladzij zonder tweeling niets — die
# bladzij komt dus byte voor byte hetzelfde uit de bouw als zonder filter.
filters:
  - _tools/taalwissel.lua

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-tools: false
    embed-resources: false
    fig-align: center
    callout-appearance: default
    callout-icon: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
