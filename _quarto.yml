project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - "werkboeken/ozp1/**"

website:
  title: "CountCamp"
  description: "Statistiek-didactiek door Benjamin Telkamp"
  site-url: "https://countcamp.org"
  repo-url: "https://github.com/CountCamp/site"

  navbar:
    left:
      - href: index.qmd
        text: Thuis
      - href: werkboeken/index.qmd
        text: Werkboeken
      - href: manuscript/index.qmd
        text: Manuscript
      - href: archief/index.qmd
        text: Archief
      - href: over.qmd
        text: Over

  page-footer:
    left: "© Benjamin Telkamp — CountCamp"
    right: "Bouwt met [Quarto](https://quarto.org)."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-tools: false
    embed-resources: false
    fig-align: center
    callout-appearance: default
    callout-icon: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
