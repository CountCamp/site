lang: nl

project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - google7b04654a69a0c7b2.html
    - "werkboeken/ozp1/**"
    - "werkboeken/mvda/**"
    - "manuscript/handleiding/**"
    - "manuscript/h*.html"
    - "manuscript/dankwoord.html"
    - "manuscript/verhalen.html"
    - "manuscript/verhalen_puur.html"
    - "manuscript/werkplaats/**"

website:
  title: "CountCamp"
  description: "Heldere uitleg over statistiek — regressie, correlatie en toetsing — door Benjamin Telkamp. Statistiek leren voelen, onderzoek leren lezen."
  site-url: "https://countcamp.org"
  repo-url: "https://github.com/CountCamp/site"
  favicon: favicon.svg
  open-graph: true
  twitter-card: true

  navbar:
    left:
      - href: index.qmd
        text: Thuis
      - href: manuscript/index.qmd
        text: Manuscript
      - href: werkboeken/index.qmd
        text: Werkboeken
      - href: archief/index.qmd
        text: Archief
      - href: diensten.qmd
        text: Diensten
      - href: over.qmd
        text: Over
      - href: cv.qmd
        text: CV

  page-footer:
    left: "© Benjamin Telkamp — CountCamp"
    right: "Bouwt met [Quarto](https://quarto.org)."

format:
  html:
    theme: cosmo
    include-in-header:
      # GoatCounter — privacy-vriendelijke bezoekersstatistiek (cookievrij, AVG-safe). Sitecode: countcamp.goatcounter.com
      - text: |
          <script data-goatcounter="https://countcamp.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-tools: false
    embed-resources: false
    fig-align: center
    callout-appearance: default
    callout-icon: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
