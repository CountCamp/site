<!-- teller:begin — bezoekersteller (GoatCounter). Bron: _tools/teller.html; de bouw zet hem erin, nooit met de hand plakken. -->
<script>
(function () {
  // Alleen de echte site telt. Op een proefdruk (broodje:8788, countcamp.org/pr-preview/),
  // op localhost of in een los geopend bestand wordt count.js niet eens opgehaald.
  var h = location.hostname, p = location.pathname;
  if (h !== 'countcamp.org' && h !== 'www.countcamp.org') return;
  if (p.indexOf('/pr-preview/') === 0) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', 'https://countcamp.goatcounter.com/count');
  document.head.appendChild(s);
})();
</script>
<!-- teller:eind -->
