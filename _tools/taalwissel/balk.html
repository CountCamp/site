<style>
/* taalbalk: een voorstel, geen doorsturen (_tools/taalwissel/balk.html) */
.taalbalk{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:0;padding:.35rem 1rem;background:#dfebf2;border-bottom:1px solid #b9cfdd;color:#1a3a5c;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.taalbalk a{color:#1a3a5c;text-decoration:underline;text-underline-offset:2px;}
.taalbalk a:hover{text-decoration-thickness:2px;}
.taalbalk button{margin:0;padding:0 .45rem;border:1px solid #1a3a5c;border-radius:3px;background:transparent;color:#1a3a5c;font:inherit;line-height:1.4;cursor:pointer;}
.taalbalk a:focus-visible,.taalbalk button:focus-visible{outline:2px solid #1a3a5c;outline-offset:2px;}
</style>
<script>
/* taalbalk: alleen voor een browser zonder Nederlands, en alleen als er een Engelse tweeling is (_tools/taalwissel/balk.html) */
(function () {
  var SLEUTEL = "countcamp-taalbalk";
  var talen = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
  var bekend = false;
  for (var i = 0; i < talen.length; i++) {
    if (!talen[i]) continue;
    if (/^nl(-|$)/i.test(talen[i])) return;
    bekend = true;
  }
  if (!bekend) return;
  try { if (window.localStorage.getItem(SLEUTEL) === "weg") return; } catch (e) {}
  function zet() {
    var doel = document.querySelector('nav a[hreflang="en"]') || document.querySelector('link[rel="alternate"][hreflang="en"]');
    if (!doel || !document.body) return;
    var balk = document.createElement("div");
    balk.className = "taalbalk";
    balk.lang = "en";
    balk.setAttribute("role", "note");
    var link = document.createElement("a");
    link.href = doel.getAttribute("href");
    link.hreflang = "en";
    link.textContent = "This page is also in English →";
    var knop = document.createElement("button");
    knop.type = "button";
    knop.setAttribute("aria-label", "Close");
    knop.textContent = "×";
    knop.addEventListener("click", function () {
      try { window.localStorage.setItem(SLEUTEL, "weg"); } catch (e) {}
      if (balk.parentNode) balk.parentNode.removeChild(balk);
    });
    balk.appendChild(link);
    balk.appendChild(knop);
    var plek = document.getElementById("quarto-header") || document.body;
    plek.insertBefore(balk, plek.firstChild);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", zet); else zet();
})();
</script>
