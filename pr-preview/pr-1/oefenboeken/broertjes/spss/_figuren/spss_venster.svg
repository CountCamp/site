<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img"
     style="max-width:100%;height:auto;font-family:-apple-system,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif"
     aria-label="Schematische plattegrond van het SPSS-venster. Bovenaan de menubalk met Analyze uitgelicht (hier kies je je toets: T-Tests, ANOVA, Regression). In het midden het datagrid met één rij per persoon. Onderaan twee tabbladen: Data View voor je getallen en Variable View waar je per variabele het meetniveau instelt (nominal, ordinal of scale). Rechtsonder een mini-inzet van de Measure-kolom.">
  <title>Het SPSS-venster in vogelvlucht</title>

  <defs>
    <!-- wiebel: geeft de rechte lijnen een handgetekende trilling -->
    <filter id="wiebel" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.05"/>
    </filter>
    <filter id="wiebel-fijn" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.7"/>
    </filter>
  </defs>

  <!-- papier -->
  <rect x="0" y="0" width="760" height="610" fill="#fdfcf9"/>

  <!-- figuur-kop -->
  <text x="40" y="27" font-size="16" font-weight="600" fill="#3a3530">Het SPSS-venster in vogelvlucht</text>

  <!-- ============ HOOFDVENSTER ============ -->
  <!-- zachte slagschaduw -->
  <rect x="44" y="46" width="508" height="322" rx="8" fill="#eceae3"/>

  <g filter="url(#wiebel)">
    <!-- vensterrand + titelbalk -->
    <rect x="40" y="42" width="508" height="322" rx="8" fill="#fffdf8" stroke="#2a2520" stroke-width="1.8"/>
    <rect x="40" y="42" width="508" height="24" rx="8" fill="#f0ece3" stroke="#2a2520" stroke-width="1.8"/>
    <line x1="40" y1="66" x2="548" y2="66" stroke="#2a2520" stroke-width="1.3"/>
    <!-- menubalk-onderrand -->
    <line x1="40" y1="90" x2="548" y2="90" stroke="#2a2520" stroke-width="1.3"/>
    <!-- Analyze uitgelicht -->
    <rect x="250" y="68" width="62" height="20" rx="4" fill="#f6e2b8" stroke="#cf9b4e" stroke-width="1.6"/>
  </g>

  <!-- titelbalk-tekst + knopjes -->
  <text x="52" y="58" font-size="11.5" fill="#3a3530">IBM SPSS Statistics — Data Editor</text>
  <g fill="none" stroke="#9a948a" stroke-width="1.2">
    <rect x="512" y="49" width="9" height="9" rx="1.5"/>
    <rect x="526" y="49" width="9" height="9" rx="1.5"/>
  </g>
  <path d="M540,49 l9,9 M549,49 l-9,9" stroke="#9a948a" stroke-width="1.2"/>

  <!-- menubalk-labels -->
  <g font-size="11" fill="#3a3530">
    <text x="54" y="82">File</text>
    <text x="88" y="82">Edit</text>
    <text x="120" y="82">View</text>
    <text x="154" y="82">Data</text>
    <text x="188" y="82">Transform</text>
    <text x="258" y="82" font-weight="600" fill="#7a5a1c">Analyze</text>
    <text x="322" y="82">Graphs</text>
    <text x="368" y="82">Utilities</text>
    <text x="420" y="82">Window</text>
    <text x="470" y="82">Help</text>
  </g>

  <!-- ===== DATAGRID ===== -->
  <!-- kolomkoppen-strook -->
  <g filter="url(#wiebel-fijn)">
    <rect x="40" y="98" width="508" height="26" fill="#f7f4ee" stroke="none"/>
    <!-- verticale kolomlijnen -->
    <g stroke="#cbc4b6" stroke-width="1">
      <line x1="84"  y1="98" x2="84"  y2="308"/>
      <line x1="200" y1="98" x2="200" y2="308"/>
      <line x1="316" y1="98" x2="316" y2="308"/>
      <line x1="432" y1="98" x2="432" y2="308"/>
    </g>
    <!-- horizontale rijlijnen -->
    <g stroke="#cbc4b6" stroke-width="1">
      <line x1="40" y1="124" x2="548" y2="124"/>
      <line x1="40" y1="152" x2="548" y2="152"/>
      <line x1="40" y1="180" x2="548" y2="180"/>
      <line x1="40" y1="208" x2="548" y2="208"/>
      <line x1="40" y1="236" x2="548" y2="236"/>
      <line x1="40" y1="264" x2="548" y2="264"/>
    </g>
    <line x1="40" y1="124" x2="548" y2="124" stroke="#9a948a" stroke-width="1.2"/>
  </g>

  <!-- kolomkoppen -->
  <g font-size="11.5" font-weight="600" fill="#3a3530" text-anchor="middle">
    <text x="142" y="115">leeftijd</text>
    <text x="258" y="115">groep</text>
    <text x="374" y="115">score</text>
  </g>

  <!-- rijnummers -->
  <g font-size="11" fill="#9a948a" text-anchor="middle">
    <text x="62" y="142">1</text>
    <text x="62" y="170">2</text>
    <text x="62" y="198">3</text>
    <text x="62" y="226">4</text>
    <text x="62" y="254">5</text>
  </g>

  <!-- celwaarden -->
  <g font-size="12" fill="#2a2520" text-anchor="middle">
    <text x="142" y="142">34</text><text x="258" y="142">1</text><text x="374" y="142">8</text>
    <text x="142" y="170">29</text><text x="258" y="170">2</text><text x="374" y="170">6</text>
    <text x="142" y="198">41</text><text x="258" y="198">1</text><text x="374" y="198">9</text>
    <text x="142" y="226">52</text><text x="258" y="226">2</text><text x="374" y="226">5</text>
    <text x="142" y="254">23</text><text x="258" y="254">1</text><text x="374" y="254">7</text>
  </g>

  <!-- ===== TABBLADEN onderaan links ===== -->
  <g filter="url(#wiebel-fijn)">
    <!-- actief: Data View -->
    <path d="M78,344 v-24 a4,4 0 0 1 4,-4 h96 a4,4 0 0 1 4,4 v24 z"
          fill="#fffdf8" stroke="#2a2520" stroke-width="1.6"/>
    <!-- inactief: Variable View -->
    <path d="M186,344 v-20 a4,4 0 0 1 4,-4 h116 a4,4 0 0 1 4,4 v20 z"
          fill="#e9e4d9" stroke="#2a2520" stroke-width="1.3"/>
  </g>
  <text x="130" y="337" font-size="11.5" font-weight="600" fill="#2a2520" text-anchor="middle">Data View</text>
  <text x="248" y="337" font-size="11.5" fill="#6a6357" text-anchor="middle">Variable View</text>

  <!-- ============ RECHTS: Analyze-kaart ============ -->
  <!-- tether van Analyze-knop naar kaart (boog boven de menubalk, kruist geen labels) -->
  <path d="M300,70 C400,40 500,42 573,84" fill="none" stroke="#cf9b4e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M573,84 l-11,-2 M573,84 l-7,8" fill="none" stroke="#cf9b4e" stroke-width="1.4"/>

  <rect x="577" y="60" width="170" height="146" rx="7" fill="#f4efe5"/>
  <g filter="url(#wiebel-fijn)">
    <rect x="573" y="56" width="170" height="146" rx="7" fill="#fffdf8" stroke="#cf9b4e" stroke-width="1.8"/>
    <rect x="573" y="56" width="170" height="24" rx="7" fill="#f6e2b8" stroke="#cf9b4e" stroke-width="1.8"/>
    <line x1="573" y1="80" x2="743" y2="80" stroke="#cf9b4e" stroke-width="1.3"/>
  </g>
  <text x="585" y="72" font-size="12" font-weight="700" fill="#7a5a1c">Analyze</text>
  <g font-size="11" fill="#2a2520">
    <text x="585" y="100">Descriptives</text>
    <text x="585" y="123">Compare Means <tspan fill="#9a948a">→ T-Tests</tspan></text>
    <text x="585" y="146">GLM <tspan fill="#9a948a">→ ANOVA</tspan></text>
    <text x="585" y="169">Correlate</text>
    <text x="585" y="192">Regression</text>
  </g>
  <text x="573" y="222" font-size="12" font-style="italic" fill="#7a6f5c">hier kies je je toets</text>

  <!-- aanwijzing datagrid (rechts van het grid, pijl naar rij 2) -->
  <path d="M556,168 C580,168 580,168 604,168" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <path d="M556,168 l11,-4 M556,168 l11,4" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <g font-size="12" fill="#7a6f5c">
    <text x="608" y="262" font-weight="600" fill="#3a3530">het datagrid</text>
    <text x="608" y="280">je getallen —</text>
    <text x="608" y="296">één rij per persoon,</text>
    <text x="608" y="312">één kolom per variabele</text>
  </g>

  <!-- aanwijzing tabbladen (onder het venster, pijl omhoog) -->
  <path d="M150,392 C150,372 150,368 150,350" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <path d="M150,350 l-4,11 M150,350 l4,11" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <g font-size="12" fill="#7a6f5c">
    <text x="170" y="386" font-weight="600" fill="#3a3530">twee schermen, één bestand</text>
    <text x="170" y="402"><tspan font-weight="600" fill="#2a2520">Data View</tspan> = je getallen ·
      <tspan font-weight="600" fill="#2a2520">Variable View</tspan> = de instellingen</text>
  </g>

  <!-- ============ MINI-INZET: Variable View / Measure-kolom ============ -->
  <rect x="44" y="424" width="404" height="170" rx="7" fill="#eceae3"/>
  <g filter="url(#wiebel-fijn)">
    <rect x="40" y="420" width="404" height="170" rx="7" fill="#fffdf8" stroke="#2a2520" stroke-width="1.6"/>
    <!-- kop-strook mini-grid -->
    <rect x="52" y="452" width="380" height="24" fill="#f7f4ee" stroke="none"/>
    <!-- Measure-kolom uitgelicht -->
    <rect x="240" y="452" width="112" height="76" fill="#f6e2b8" stroke="#cf9b4e" stroke-width="1.5"/>
    <!-- kolomlijnen -->
    <g stroke="#cbc4b6" stroke-width="1">
      <line x1="150" y1="452" x2="150" y2="528"/>
      <line x1="240" y1="452" x2="240" y2="528"/>
      <line x1="352" y1="452" x2="352" y2="528"/>
      <line x1="52"  y1="476" x2="432" y2="476"/>
      <line x1="52"  y1="502" x2="432" y2="502"/>
    </g>
    <line x1="52" y1="476" x2="432" y2="476" stroke="#9a948a" stroke-width="1.1"/>
  </g>

  <text x="52" y="442" font-size="12" font-weight="600" fill="#3a3530">Variable View — één rij per variabele</text>

  <!-- mini-grid koppen -->
  <g font-size="10.5" font-weight="600" fill="#3a3530">
    <text x="60" y="468">Name</text>
    <text x="158" y="468">Type</text>
    <text x="248" y="468" fill="#7a5a1c">Measure</text>
    <text x="360" y="468">Values</text>
  </g>
  <!-- mini-grid rijen -->
  <g font-size="11" fill="#2a2520">
    <text x="60" y="493">leeftijd</text>
    <text x="158" y="493">Numeric</text>
    <text x="248" y="493" font-weight="600">Scale</text>
    <text x="360" y="493" fill="#9a948a">—</text>

    <text x="60" y="519">groep</text>
    <text x="158" y="519">Numeric</text>
    <text x="248" y="519" font-weight="600">Nominal</text>
    <text x="360" y="519" fill="#9a948a">{1,2}</text>
  </g>

  <!-- Measure keuzelijstje (mini-inzet van de dropdown) -->
  <path d="M300,528 l0,10 M300,538 l-4,-5 M300,538 l4,-5" fill="none" stroke="#cf9b4e" stroke-width="1.4"/>
  <g filter="url(#wiebel-fijn)">
    <rect x="228" y="540" width="146" height="46" rx="5" fill="#fffdf8" stroke="#cf9b4e" stroke-width="1.5"/>
  </g>
  <g font-size="10.5" fill="#2a2520">
    <!-- Scale: liniaal-icoontje -->
    <g stroke="#6a6357" stroke-width="1" fill="none"><rect x="236" y="547" width="14" height="7" rx="1"/><line x1="240" y1="547" x2="240" y2="551"/><line x1="244" y1="547" x2="244" y2="551"/><line x1="248" y1="547" x2="248" y2="551"/></g>
    <text x="256" y="554">Scale</text>
    <!-- Ordinal: oplopende balkjes -->
    <g stroke="#6a6357" stroke-width="1.4"><line x1="238" y1="571" x2="238" y2="568"/><line x1="242" y1="571" x2="242" y2="565"/><line x1="246" y1="571" x2="246" y2="561"/></g>
    <text x="256" y="571">Ordinal</text>
    <!-- Nominal: drie bolletjes -->
    <g fill="#6a6357"><circle cx="238" cy="580" r="2.1"/><circle cx="244" cy="580" r="2.1"/><circle cx="250" cy="580" r="2.1"/></g>
    <text x="256" y="583">Nominal</text>
  </g>

  <!-- uitleg naast de inzet -->
  <path d="M456,500 C476,500 476,500 496,500" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <path d="M456,500 l11,-4 M456,500 l11,4" fill="none" stroke="#9a948a" stroke-width="1.4"/>
  <g font-size="12" fill="#7a6f5c">
    <text x="500" y="452" font-weight="600" fill="#3a3530">De Measure-kolom</text>
    <text x="500" y="472">hier stel je per variabele</text>
    <text x="500" y="488">het meetniveau in:</text>
    <text x="500" y="512"><tspan font-weight="600" fill="#2a2520">nominal</tspan> — hokjes zonder rangorde</text>
    <text x="500" y="530"><tspan font-weight="600" fill="#2a2520">ordinal</tspan> — een volgorde</text>
    <text x="500" y="548"><tspan font-weight="600" fill="#2a2520">scale</tspan> — echte getallen</text>
    <text x="500" y="574" font-style="italic" fill="#9a948a">SPSS kiest zelf iets — vaak fout.</text>
    <text x="500" y="590" font-style="italic" fill="#9a948a">Controleer het altijd zelf.</text>
  </g>
</svg>
