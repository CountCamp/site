# ============================================================
# _variables.yml — waarden die op meer dan één bladzij staan, op ÉÉN plek.
# ------------------------------------------------------------
# Quarto leest dit bestand bij elke bouw, in elk profiel en in beide talen
# (gemeten 27-11-2026 op 1.9.38, spoor site_steun: de Nederlandse en de Engelse
# ronde zetten allebei dezelfde waarde, ook in een link-adres). In een bladzij:
#     {{< var steun.stripe >}}
# Een waarde veranderen = de regel hieronder veranderen, EN daarna
# bash _tools/publiceer_en.sh draaien en committen wat hij in en/ zet. Het
# Nederlands bouwt de Action vers, maar de Engelse bladzijden staan gebouwd in de
# repo en houden anders de oude waarde. Vergeet je het, dan houdt
# _tools/naar_buiten.sh --productie de levering tegen (_tools/variabelenwacht.py).
# Schrijf elke waarde tussen dubbele aanhalingstekens, twee spaties per niveau:
# die wachter leest zonder PyYAML en weigert (afloop 3) wat hij niet kent.
# ============================================================

steun:
  # De betaallink van Stripe (Payment Link, "klant kiest het bedrag"), voor de
  # knop op steun.qmd en en/support.qmd. Ben heeft het Stripe-account nog niet
  # (27-11-2026); tot die tijd wijst de knop naar dit anker, dat nergens heen
  # gaat. Komt de link er, dan hier de volledige https://buy.stripe.com/...
  stripe: "#stripe-link-volgt"
  # Het KvK-nummer van WISI, de eenmanszaak van Ben. Stripe eist het voor iDEAL
  # op de website. Nagemeten 27-11-2026 door C op drie van Bens eigen facturen
  # (voetregel "KvK 28111063"). Het btw-nummer staat bewust NIET op de site.
  kvk: "28111063"
