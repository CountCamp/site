<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img"
     style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif"
     aria-label="Schematische plattegrond van het JASP-venster. Bovenaan het analyse-lint waar je een analyse kiest, met linksboven het hamburgermenu om je databestand te openen. Links het data-blad met kolomkop-icoontjes voor het meetniveau. Rechts het resultaten-paneel waar tabellen en grafieken meteen verschijnen.">
  <title>Het JASP-venster in één oogopslag</title>

  <defs>
    <!-- wiebel: geeft de lijnen een handgetekende trilling (overgenomen uit snavel_lengte_diepte.svg) -->
    <filter id="wiebel" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.5"/>
    </filter>
  </defs>

  <!-- papier -->
  <rect x="0" y="0" width="900" height="720" fill="#fdfcf9"/>

  <!-- ===================== LIJN-WERK (met wiebel) ===================== -->
  <g filter="url(#wiebel)">

    <!-- vlakvullingen -->
    <rect x="50" y="150" width="800" height="440" rx="16" fill="#ffffff"/>
    <rect x="50" y="150" width="800" height="32"  fill="#f0e9dc"/>        <!-- titelbalk -->
    <rect x="50" y="182" width="800" height="62"  fill="#f4efe6"/>        <!-- lint -->
    <rect x="410" y="244" width="440" height="346" fill="#faf7f0"/>       <!-- resultaten wash -->
    <rect x="50" y="244" width="360" height="38"  fill="#efe8db"/>        <!-- kolomkoppen -->

    <!-- venster-omlijsting -->
    <rect x="50" y="150" width="800" height="440" rx="16" fill="none" stroke="#3a3530" stroke-width="2.6"/>
    <line x1="50" y1="182" x2="850" y2="182" stroke="#3a3530" stroke-width="1.6"/>
    <line x1="50" y1="244" x2="850" y2="244" stroke="#3a3530" stroke-width="1.6"/>
    <line x1="410" y1="244" x2="410" y2="590" stroke="#3a3530" stroke-width="1.8"/>

    <!-- titelbalk-stipjes -->
    <circle cx="72" cy="166" r="4.5" fill="#c0703a"/>
    <circle cx="90" cy="166" r="4.5" fill="#cdb46a"/>
    <circle cx="108" cy="166" r="4.5" fill="#86995f"/>

    <!-- hamburgermenu (databestand openen) -->
    <rect x="66" y="196" width="40" height="34" rx="6" fill="#fdfcf9" stroke="#3a3530" stroke-width="1.8"/>
    <line x1="76" y1="206" x2="96" y2="206" stroke="#2a2520" stroke-width="2"/>
    <line x1="76" y1="213" x2="96" y2="213" stroke="#2a2520" stroke-width="2"/>
    <line x1="76" y1="220" x2="96" y2="220" stroke="#2a2520" stroke-width="2"/>

    <!-- lint-knoppen -->
    <!-- b1 Descriptives (staafjes) -->
    <rect x="126" y="190" width="128" height="48" rx="8" fill="#fdfcf9" stroke="#9a948a" stroke-width="1.3"/>
    <g stroke="#3a3530" stroke-width="2.4" stroke-linecap="round">
      <line x1="181" y1="212" x2="181" y2="204"/>
      <line x1="190" y1="212" x2="190" y2="199"/>
      <line x1="199" y1="212" x2="199" y2="207"/>
    </g>
    <!-- b2 T-Tests (twee bulten) -->
    <rect x="266" y="190" width="128" height="48" rx="8" fill="#fdfcf9" stroke="#9a948a" stroke-width="1.3"/>
    <path d="M312,212 C316,200 322,200 326,212" fill="none" stroke="#3a3530" stroke-width="2"/>
    <path d="M324,212 C328,202 334,202 338,212" fill="none" stroke="#3a3530" stroke-width="2"/>
    <!-- b3 ANOVA (drie staven) -->
    <rect x="406" y="190" width="128" height="48" rx="8" fill="#fdfcf9" stroke="#9a948a" stroke-width="1.3"/>
    <g stroke="#3a3530" stroke-width="4" stroke-linecap="round">
      <line x1="460" y1="212" x2="460" y2="207"/>
      <line x1="470" y1="212" x2="470" y2="201"/>
      <line x1="480" y1="212" x2="480" y2="204"/>
    </g>
    <!-- b4 Regression (puntenwolk + lijn) -->
    <rect x="546" y="190" width="128" height="48" rx="8" fill="#fdfcf9" stroke="#9a948a" stroke-width="1.3"/>
    <line x1="596" y1="213" x2="624" y2="199" stroke="#3a3530" stroke-width="1.8"/>
    <g fill="#3a3530">
      <circle cx="598" cy="210" r="1.7"/><circle cx="606" cy="209" r="1.7"/>
      <circle cx="611" cy="204" r="1.7"/><circle cx="619" cy="203" r="1.7"/>
    </g>
    <!-- b5 Frequencies (taartje) -->
    <rect x="686" y="190" width="128" height="48" rx="8" fill="#fdfcf9" stroke="#9a948a" stroke-width="1.3"/>
    <circle cx="750" cy="206" r="8" fill="none" stroke="#3a3530" stroke-width="1.8"/>
    <path d="M750,206 L750,198 M750,206 L757,209" stroke="#3a3530" stroke-width="1.8"/>

    <!-- ===== DATA-BLAD raster ===== -->
    <line x1="84"  y1="244" x2="84"  y2="462" stroke="#c9c1b4" stroke-width="1"/>
    <line x1="192" y1="244" x2="192" y2="462" stroke="#c9c1b4" stroke-width="1"/>
    <line x1="300" y1="244" x2="300" y2="462" stroke="#c9c1b4" stroke-width="1"/>
    <line x1="50"  y1="282" x2="410" y2="282" stroke="#3a3530" stroke-width="1.3"/>
    <line x1="50"  y1="312" x2="410" y2="312" stroke="#e0d9cc" stroke-width="1"/>
    <line x1="50"  y1="342" x2="410" y2="342" stroke="#e0d9cc" stroke-width="1"/>
    <line x1="50"  y1="372" x2="410" y2="372" stroke="#e0d9cc" stroke-width="1"/>
    <line x1="50"  y1="402" x2="410" y2="402" stroke="#e0d9cc" stroke-width="1"/>
    <line x1="50"  y1="432" x2="410" y2="432" stroke="#e0d9cc" stroke-width="1"/>

    <!-- kolomkop-icoontjes (meetniveau) -->
    <!-- nominaal: drie bolletjes -->
    <circle cx="95"  cy="261" r="3" fill="#c0703a"/>
    <circle cx="103" cy="261" r="3" fill="#86995f"/>
    <circle cx="111" cy="261" r="3" fill="#5f7fa8"/>
    <!-- schaal: liniaaltje -->
    <rect x="200" y="257" width="17" height="7" fill="#fdfcf9" stroke="#3a3530" stroke-width="1.2"/>
    <line x1="205" y1="257" x2="205" y2="260" stroke="#3a3530" stroke-width="1"/>
    <line x1="209" y1="257" x2="209" y2="260" stroke="#3a3530" stroke-width="1"/>
    <line x1="213" y1="257" x2="213" y2="260" stroke="#3a3530" stroke-width="1"/>
    <!-- ordinaal: oplopende staafjes -->
    <g stroke="#3a3530" stroke-width="2.6" stroke-linecap="round">
      <line x1="308" y1="265" x2="308" y2="262"/>
      <line x1="313" y1="265" x2="313" y2="259"/>
      <line x1="318" y1="265" x2="318" y2="256"/>
    </g>

    <!-- ===== RESULTATEN: APA-tabel ===== -->
    <line x1="440" y1="300" x2="820" y2="300" stroke="#3a3530" stroke-width="1.8"/>
    <line x1="440" y1="326" x2="820" y2="326" stroke="#3a3530" stroke-width="1.1"/>
    <line x1="440" y1="418" x2="820" y2="418" stroke="#3a3530" stroke-width="1.8"/>

    <!-- ===== RESULTATEN: staafdiagram ===== -->
    <line x1="470" y1="460" x2="470" y2="560" stroke="#3a3530" stroke-width="1.6"/>
    <line x1="470" y1="560" x2="810" y2="560" stroke="#3a3530" stroke-width="1.6"/>
    <g fill="#ead9bb" stroke="#3a3530" stroke-width="1.3">
      <rect x="490" y="518" width="38" height="42"/>
      <rect x="540" y="492" width="38" height="68"/>
      <rect x="590" y="472" width="38" height="88"/>
      <rect x="640" y="504" width="38" height="56"/>
      <rect x="690" y="528" width="38" height="32"/>
    </g>

    <!-- ===== AANWIJS-PIJLEN (warm ocher) ===== -->
    <g fill="none" stroke="#b8863b" stroke-width="1.9" stroke-linecap="round">
      <!-- hamburger -->
      <path d="M150,140 Q108,164 90,190"/>
      <path d="M90,190 l-7,-9 M90,190 l7,-8"/>
      <!-- lint -->
      <path d="M540,138 Q500,162 472,186"/>
      <path d="M472,186 l-8,-8 M472,186 l6,-9"/>
      <!-- data-blad -->
      <path d="M150,612 Q72,440 98,270"/>
      <path d="M98,270 l-8,8 M98,270 l7,9"/>
      <!-- resultaten -->
      <path d="M632,612 Q622,505 612,430"/>
      <path d="M612,430 l-8,8 M612,430 l7,9"/>
    </g>

    <!-- legenda-icoontjes -->
    <circle cx="64" cy="676" r="3" fill="#c0703a"/>
    <circle cx="72" cy="676" r="3" fill="#86995f"/>
    <circle cx="80" cy="676" r="3" fill="#5f7fa8"/>
    <rect x="196" y="672" width="17" height="7" fill="#fdfcf9" stroke="#3a3530" stroke-width="1.2"/>
    <line x1="201" y1="672" x2="201" y2="675" stroke="#3a3530" stroke-width="1"/>
    <line x1="205" y1="672" x2="205" y2="675" stroke="#3a3530" stroke-width="1"/>
    <line x1="209" y1="672" x2="209" y2="675" stroke="#3a3530" stroke-width="1"/>
    <g stroke="#3a3530" stroke-width="2.6" stroke-linecap="round">
      <line x1="330" y1="680" x2="330" y2="677"/>
      <line x1="335" y1="680" x2="335" y2="673"/>
      <line x1="340" y1="680" x2="340" y2="670"/>
    </g>
  </g>

  <!-- ===================== TEKST (scherp, geen wiebel) ===================== -->

  <!-- figuur-titel -->
  <text x="50" y="42" font-size="21" fill="#3a3530" font-weight="600">Het JASP-venster</text>
  <text x="50" y="63" font-size="13.5" fill="#9a948a">drie plekken, meer heb je om te beginnen niet nodig</text>

  <!-- titelbalk -->
  <text x="450" y="171" font-size="12.5" fill="#8a847a" text-anchor="middle">diamantjes.jasp — JASP</text>

  <!-- lint-knop-labels -->
  <g font-size="12.5" fill="#3a3530" text-anchor="middle">
    <text x="190" y="231">Descriptives</text>
    <text x="330" y="231">T-Tests</text>
    <text x="470" y="231">ANOVA</text>
    <text x="610" y="231">Regression</text>
    <text x="750" y="231">Frequencies</text>
  </g>

  <!-- kolomkoppen -->
  <g font-size="12.5" fill="#3a3530" font-weight="600">
    <text x="120" y="266">naam</text>
    <text x="224" y="266">karaat</text>
    <text x="326" y="266">klasse</text>
  </g>

  <!-- data-cellen -->
  <g font-size="12" fill="#2a2520">
    <g fill="#9a948a" text-anchor="middle">
      <text x="67" y="301">1</text><text x="67" y="331">2</text><text x="67" y="361">3</text>
      <text x="67" y="391">4</text><text x="67" y="421">5</text><text x="67" y="451">6</text>
    </g>
    <g text-anchor="middle">
      <text x="138" y="301">Kees</text><text x="138" y="331">Elly</text><text x="138" y="361">Moos</text>
      <text x="138" y="391">Bram</text><text x="138" y="421">Sofie</text><text x="138" y="451">Ton</text>
    </g>
    <g text-anchor="middle">
      <text x="246" y="301">0.9</text><text x="246" y="331">1.1</text><text x="246" y="361">1.0</text>
      <text x="246" y="391">1.2</text><text x="246" y="421">0.8</text><text x="246" y="451">1.0</text>
    </g>
    <g text-anchor="middle">
      <text x="355" y="301">laag</text><text x="355" y="331">hoog</text><text x="355" y="361">midden</text>
      <text x="355" y="391">hoog</text><text x="355" y="421">laag</text><text x="355" y="451">midden</text>
    </g>
  </g>

  <!-- resultaten-tabel tekst -->
  <text x="440" y="293" font-size="13.5" fill="#3a3530" font-weight="600">Descriptive Statistics</text>
  <g font-size="12" fill="#2a2520">
    <text x="605" y="319" text-anchor="middle" fill="#3a3530">karaat</text>
    <text x="715" y="319" text-anchor="middle" fill="#3a3530">glans</text>
    <text x="448" y="345">Valid</text>       <text x="605" y="345" text-anchor="middle">12</text>   <text x="715" y="345" text-anchor="middle">12</text>
    <text x="448" y="371">Mean</text>        <text x="605" y="371" text-anchor="middle">1.00</text> <text x="715" y="371" text-anchor="middle">50.4</text>
    <text x="448" y="397">Std. Deviation</text><text x="605" y="397" text-anchor="middle">0.14</text> <text x="715" y="397" text-anchor="middle">8.7</text>
  </g>

  <!-- AANWIJS-LABELS -->
  <!-- hamburger -->
  <text x="118" y="108" font-size="14.5" fill="#3a3530" font-weight="600">Hier open je je data</text>
  <text x="118" y="126" font-size="12" fill="#9a948a">klik op het menu <tspan font-weight="600">≡</tspan></text>
  <!-- lint -->
  <text x="560" y="102" font-size="14.5" fill="#3a3530" font-weight="600" text-anchor="middle">Kies hier je analyse</text>
  <text x="560" y="120" font-size="12" fill="#9a948a" text-anchor="middle">het lint: Descriptives, T-Tests, ANOVA…</text>
  <!-- data-blad -->
  <text x="52" y="623" font-size="14.5" fill="#3a3530" font-weight="600">Je data staat hier</text>
  <text x="52" y="641" font-size="12" fill="#9a948a">de icoontjes bij de kolomkop tonen het meetniveau:</text>
  <g font-size="12" fill="#7a746a">
    <text x="90" y="681">nominaal</text>
    <text x="222" y="681">schaal</text>
    <text x="350" y="681">ordinaal</text>
  </g>
  <!-- resultaten -->
  <text x="632" y="623" font-size="14.5" fill="#3a3530" font-weight="600" text-anchor="middle">Hier komen je resultaten</text>
  <text x="632" y="641" font-size="12" fill="#9a948a" text-anchor="middle">tabellen en grafieken verschijnen meteen</text>
</svg>
