# ============================================================
# _quarto-echt.yml — het bouwprofiel van DE ECHTE SITE.
# ------------------------------------------------------------
# Dit profiel draait vanzelf (`profile: default: echt` in _quarto.yml), dus
# `quarto render` en de GitHub Action bouwen hiermee zonder dat er iets
# extra's hoeft. Alleen wie expliciet `QUARTO_PROFILE=spook` zegt, krijgt de
# proefdruk in plaats hiervan.
#
# Wat hier hoort: alles wat ALLEEN op de echte site thuishoort. Op dit moment
# is dat de bezoekersteller. Zet hier niets neer wat een proefdruk ook nodig
# heeft — dat hoort in _quarto.yml, want dat leest allebei.
#
# De teller stond tot 12-8-2026 in _quarto.yml. Hij is verhuisd omdat een
# proefdruk anders meetelt in Bens bezoekcijfers: een profiel kan een
# include-in-header wel AANVULLEN maar niet WEGHALEN.
#
# CONTROLE. naar_buiten.sh --productie kijkt na de render of deze teller er
# echt in zit en weigert te leveren als hij weg is. Zonder die controle zou
# een tikfout in de profielnaam de teller stilletjes van de site halen, en dat
# merk je pas maanden later aan een grafiek die op nul staat.
# ============================================================

format:
  html:
    include-in-header:
      # GoatCounter — privacy-vriendelijke bezoekersstatistiek (cookievrij, AVG-safe).
      # Sitecode: countcamp.goatcounter.com
      - text: |
          <script data-goatcounter="https://countcamp.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
