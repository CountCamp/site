# Alleen om te METEN. Dit is een handmatige kopie van het format-blok uit
# _quarto.yml, nodig omdat Quarto het project niet ziet zolang de werkkopie
# onder een map staat die met een punt begint (.claude/worktrees/...).
lang: nl
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-tools: false
    embed-resources: false
    fig-align: center
    callout-appearance: default
    callout-icon: false
