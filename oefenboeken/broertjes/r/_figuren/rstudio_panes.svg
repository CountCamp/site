<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img"
     style="max-width:100%;height:auto"
     aria-label="Schematische plattegrond van het RStudio-venster. Bovenaan een menubalk. Daaronder vier vakken: linksboven de Source/Editor waar je je script bewaart, linksonder de Console waar je een opdracht typt die meteen draait, rechtsboven de Environment met je data en objecten, rechtsonder Files, Plots, Packages en Help met je bestanden, grafieken en hulp.">
  <title>Het RStudio-venster — de vier vakken</title>
  <defs>
    <!-- wiebel: geeft de lijnen een zachte handgetekende trilling -->
    <filter id="wiebel" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.010" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.95"/>
    </filter>
  </defs>

  <!-- ===== titel boven het venster ===== -->
  <g font-family="Georgia, 'EB Garamond', serif" text-anchor="middle">
    <text x="460" y="26" font-size="21" fill="#3a3530">Het RStudio-venster — de vier vakken</text>
  </g>

  <!-- ===== STRUCTUUR (met wiebel-filter, hand-getekend) ===== -->
  <g filter="url(#wiebel)" stroke="#4a3f30" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- venster-achtergrond -->
    <rect x="16" y="42" width="888" height="588" rx="10" fill="#f4f1ea"/>

    <!-- menubalk -->
    <rect x="16" y="42" width="888" height="30" rx="10" fill="#e9e3d6"/>
    <line x1="16" y1="72" x2="904" y2="72" stroke-width="1.4"/>

    <!-- ===== de vier vakken ===== -->
    <!-- 1. Source / Editor  (linksboven) -->
    <rect x="24" y="82" width="430" height="266" rx="8" fill="#fdfcf9"/>
    <rect x="24" y="82" width="430" height="27" rx="8" fill="#e9e3d6"/>
    <line x1="24" y1="109" x2="454" y2="109" stroke-width="1.3"/>

    <!-- 2. Console  (linksonder) -->
    <rect x="24" y="354" width="430" height="266" rx="8" fill="#fdfcf9"/>
    <rect x="24" y="354" width="430" height="27" rx="8" fill="#e9e3d6"/>
    <line x1="24" y1="381" x2="454" y2="381" stroke-width="1.3"/>

    <!-- 3. Environment / History  (rechtsboven) -->
    <rect x="466" y="82" width="430" height="266" rx="8" fill="#fdfcf9"/>
    <rect x="466" y="82" width="430" height="27" rx="8" fill="#e9e3d6"/>
    <line x1="466" y1="109" x2="896" y2="109" stroke-width="1.3"/>

    <!-- 4. Files · Plots · Packages · Help  (rechtsonder) -->
    <rect x="466" y="354" width="430" height="266" rx="8" fill="#fdfcf9"/>
    <rect x="466" y="354" width="430" height="27" rx="8" fill="#e9e3d6"/>
    <line x1="466" y1="381" x2="896" y2="381" stroke-width="1.3"/>

    <!-- genummerde bolletjes bij elk vak -->
    <circle cx="40" cy="95"  r="11" fill="#c2764a" stroke="none"/>
    <circle cx="40" cy="367" r="11" fill="#c2764a" stroke="none"/>
    <circle cx="482" cy="95" r="11" fill="#c2764a" stroke="none"/>
    <circle cx="482" cy="367" r="11" fill="#c2764a" stroke="none"/>

    <!-- ===== inhoud vak 1: Source ===== -->
    <!-- regelnummer-goot -->
    <line x1="62" y1="112" x2="62" y2="316" stroke-width="1.1" stroke="#c9c1b2"/>
    <!-- "Run"-knopje -->
    <rect x="392" y="88" width="54" height="17" rx="5" fill="#f4ede0" stroke-width="1.3"/>
    <path d="M400,92 l0,9 l7,-4.5 z" fill="#c2764a" stroke="none"/>

    <!-- ===== inhoud vak 2: Console ===== -->
    <!-- knipperende cursor -->
    <rect x="52" y="450" width="7" height="14" fill="#c2764a" stroke="none"/>

    <!-- ===== inhoud vak 3: Environment ===== -->
    <line x1="474" y1="150" x2="888" y2="150" stroke-width="1.1" stroke="#d8d1c2"/>
    <line x1="474" y1="196" x2="888" y2="196" stroke-width="1.1" stroke="#d8d1c2"/>
    <!-- klein rooster-icoontje bij de dataset -->
    <rect x="478" y="160" width="14" height="12" rx="1.5" fill="#f4ede0" stroke-width="1.2"/>
    <line x1="478" y1="166" x2="492" y2="166" stroke-width="1"/>
    <line x1="485" y1="160" x2="485" y2="172" stroke-width="1"/>

    <!-- ===== inhoud vak 4: een grafiekje (Plots) ===== -->
    <!-- assen -->
    <line x1="560" y1="580" x2="860" y2="580"/>
    <line x1="560" y1="580" x2="560" y2="418"/>
    <!-- puntenwolk, licht stijgend -->
    <circle cx="600" cy="548" r="4" fill="#c2764a" stroke="none"/>
    <circle cx="640" cy="536" r="4" fill="#c2764a" stroke="none"/>
    <circle cx="680" cy="512" r="4" fill="#c2764a" stroke="none"/>
    <circle cx="720" cy="500" r="4" fill="#c2764a" stroke="none"/>
    <circle cx="760" cy="470" r="4" fill="#c2764a" stroke="none"/>
    <circle cx="800" cy="452" r="4" fill="#c2764a" stroke="none"/>
    <!-- trendlijntje -->
    <path d="M590,552 C680,520 740,485 820,448" stroke="#8a8170" stroke-width="1.6" fill="none" stroke-dasharray="5 5"/>

    <!-- ===== pijl naar de console-prompt ("hier typ je") ===== -->
    <path d="M300,457 L96,457" stroke="#c2764a" stroke-width="2.4" fill="none"/>
    <path d="M96,457 l14,-7 M96,457 l14,7" stroke="#c2764a" stroke-width="2.4" fill="none"/>
  </g>

  <!-- ===== TEKST (crisp, buiten het filter) ===== -->

  <!-- nummers in de bolletjes -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="14" font-weight="700" fill="#fdfcf9" text-anchor="middle">
    <text x="40" y="100">1</text>
    <text x="40" y="372">2</text>
    <text x="482" y="100">3</text>
    <text x="482" y="372">4</text>
  </g>

  <!-- menubalk-tekst -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="12.5" fill="#7a6f5c">
    <text x="34" y="61">File</text>
    <text x="74" y="61">Edit</text>
    <text x="112" y="61">Code</text>
    <text x="156" y="61">View</text>
    <text x="200" y="61">Session</text>
    <text x="262" y="61">Build</text>
    <text x="306" y="61">Tools</text>
    <text x="352" y="61">Help</text>
  </g>

  <!-- tabbladen + namen per vak -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
    <!-- vak 1 -->
    <text x="58" y="100" fill="#3a3530" font-weight="600">oefening.qmd</text>
    <text x="164" y="100" fill="#9a948a">analyse.R</text>
    <rect x="56" y="103" width="80" height="2.4" fill="#c2764a"/>
    <text x="418" y="101" fill="#7a6f5c" font-size="11">Run</text>
    <!-- vak 2 -->
    <text x="58" y="372" fill="#3a3530" font-weight="600">Console</text>
    <text x="120" y="372" fill="#9a948a">Terminal</text>
    <text x="186" y="372" fill="#9a948a">Jobs</text>
    <rect x="56" y="375" width="52" height="2.4" fill="#c2764a"/>
    <!-- vak 3 -->
    <text x="500" y="100" fill="#3a3530" font-weight="600">Environment</text>
    <text x="590" y="100" fill="#9a948a">History</text>
    <text x="648" y="100" fill="#9a948a">Connections</text>
    <rect x="498" y="103" width="86" height="2.4" fill="#c2764a"/>
    <!-- vak 4 -->
    <text x="500" y="372" fill="#9a948a">Files</text>
    <text x="540" y="372" fill="#3a3530" font-weight="600">Plots</text>
    <text x="586" y="372" fill="#9a948a">Packages</text>
    <text x="654" y="372" fill="#9a948a">Help</text>
    <rect x="538" y="375" width="38" height="2.4" fill="#c2764a"/>
  </g>

  <!-- inhoud vak 1: code-regels (monospace) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
    <g fill="#b6ada0" text-anchor="end">
      <text x="55" y="130">1</text>
      <text x="55" y="152">2</text>
      <text x="55" y="174">3</text>
      <text x="55" y="196">4</text>
    </g>
    <text x="72" y="130" fill="#7d8a6a"># mijn eerste script</text>
    <text x="72" y="152" fill="#4a3f30">karaat &lt;- c(1.0, 0.9, 1.2)</text>
    <text x="72" y="174" fill="#4a3f30">glans  &lt;- c(50, 48, 55)</text>
    <text x="72" y="196" fill="#4a3f30">mean(karaat)</text>
  </g>

  <!-- inhoud vak 2: console-output (monospace) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
    <text x="42" y="404" fill="#c2764a">&gt;</text>
    <text x="56" y="404" fill="#4a3f30">mean(karaat)</text>
    <text x="42" y="426" fill="#8a8170">[1] 1.033</text>
    <text x="42" y="462" fill="#c2764a">&gt;</text>
  </g>

  <!-- inhoud vak 3: environment-objecten (monospace + kopjes) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
    <text x="476" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#9a948a">Data</text>
    <text x="500" y="170" fill="#4a3f30">diamantjes</text>
    <text x="700" y="170" fill="#8a8170">12 obs. of 2 var.</text>
    <text x="476" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#9a948a">Values</text>
    <text x="480" y="216" fill="#4a3f30">karaat</text>
    <text x="580" y="216" fill="#8a8170">num [1:12] 1 0.9 …</text>
    <text x="480" y="236" fill="#4a3f30">glans</text>
    <text x="580" y="236" fill="#8a8170">num [1:12] 50 48 …</text>
  </g>

  <!-- ===== warme Nederlandse toelichtingen (serif, potlood) ===== -->
  <g font-family="Georgia, 'EB Garamond', serif" fill="#6b6150" font-style="italic">
    <!-- vak 1 -->
    <text x="72" y="300" font-size="13.5">je script (.qmd of .R):</text>
    <text x="72" y="320" font-size="13.5" fill="#9a948a">hier schrijf je code die je bewáárt</text>
    <!-- vak 2: de belangrijke -->
    <text x="150" y="500" font-size="14.5" fill="#c2764a">hier typ je een opdracht in</text>
    <text x="150" y="520" font-size="13" fill="#9a948a">…en hij draait meteen; het antwoord</text>
    <text x="150" y="537" font-size="13" fill="#9a948a">verschijnt er direct onder</text>
    <!-- vak 3 -->
    <text x="500" y="300" font-size="13.5">je data en objecten:</text>
    <text x="500" y="320" font-size="13.5" fill="#9a948a">alles wat R nú onthoudt</text>
    <!-- vak 4 -->
    <text x="600" y="608" font-size="13.5" fill="#9a948a" text-anchor="middle">je bestanden · je grafieken · hulp</text>
  </g>
</svg>
