<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="Handschets van een pinguïnkop in profiel. De snavellengte loopt van voor naar achter; de snaveldiepte is de hoogte van de snavel van boven naar onder.">
  <title>Snavel: lengte en diepte</title>
  <defs>
    <!-- wiebel: geeft de lijnen een handgetekende trilling -->
    <filter id="wiebel" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.018" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2"/>
    </filter>
  </defs>

  <!-- transparante achtergrond: staat zo op het papier-wit vel -->
  <g filter="url(#wiebel)" fill="none" stroke="#4a3f30" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- kop (profiel), bol naar links -->
    <path d="M150,118 C118,110 92,124 90,152 C88,182 116,200 150,192"/>
    <!-- kruintje/nek achter -->
    <path d="M150,118 C146,108 150,100 160,99"/>
    <path d="M150,192 C150,204 156,212 166,214"/>

    <!-- de snavel: boven- en onderrand lopen naar een punt rechts -->
    <path d="M150,120 C205,126 262,140 300,150"/>   <!-- bovenrand -->
    <path d="M150,190 C200,186 258,168 300,150"/>   <!-- onderrand -->
    <!-- mondlijn -->
    <path d="M154,155 C205,156 260,153 298,150" stroke-width="1.6"/>

    <!-- oog -->
    <circle cx="118" cy="146" r="3.4" fill="#4a3f30"/>

    <!-- LENGTE: horizontale pijl onder de snavel -->
    <path d="M150,238 L300,238"/>
    <path d="M150,238 l12,-6 M150,238 l12,6"/>   <!-- pijlpunt links -->
    <path d="M300,238 l-12,-6 M300,238 l-12,6"/> <!-- pijlpunt rechts -->

    <!-- DIEPTE: verticale pijl bij de snavelbasis (hoogte boven-onder) -->
    <path d="M138,120 L138,190"/>
    <path d="M138,120 l-6,12 M138,120 l6,12"/>    <!-- pijlpunt boven -->
    <path d="M138,190 l-6,-12 M138,190 l6,-12"/>  <!-- pijlpunt onder -->
  </g>

  <!-- labels: storybook-serif, warm -->
  <g font-family="Georgia, 'EB Garamond', serif" fill="#4a3f30">
    <text x="225" y="262" font-size="19" font-style="italic" text-anchor="middle">lengte</text>
    <text x="225" y="280" font-size="12.5" fill="#7a6f5c" text-anchor="middle">van voor naar achter</text>
    <text x="86" y="150" font-size="19" font-style="italic" text-anchor="end">diepte</text>
    <text x="86" y="167" font-size="12.5" fill="#7a6f5c" text-anchor="end">= hoogte, boven→onder</text>
  </g>
</svg>
